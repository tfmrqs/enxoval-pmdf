<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enxoval CFP - PMDF</title>
  
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- jsPDF + AutoTable para geração do relatório -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --sidebar-bg: #111827;
      --border: #22304e;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; overflow-x: hidden; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-voltar {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.2s;
    }
    .btn-voltar:hover { color: var(--text); }

    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }

    .btn-nav-lojas {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-nav-lojas:hover {
      background: #28374f;
      border-color: #475569;
      color: #ffffff;
      transform: translateY(-1px);
    }
    
    .btn-toggle-cart {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.2s;
    }
    .btn-toggle-cart:hover { background: var(--primary-hover); }

    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toolbar select, .toolbar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .toolbar input { min-width: 250px; }

    .grid-itens {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 180px;            /* Altura fixa da moldura */
      object-fit: contain;      /* Garante que o equipamento apareça inteiro sem esticar */
      object-position: center;  /* Centraliza a foto horizontal e verticalmente */
      background-color: #0b1329;/* Fundo sutil para preencher as sobras */
      padding: 0.75rem;         /* Respiro para a imagem não colar nas bordas do card */
      border-bottom: 1px solid var(--border);
    }

    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; flex-grow: 1; }

    .card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tag-fase { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    .item-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .item-spec { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }

    .offer-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 6px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .offer-box select, .offer-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls-row { display: flex; gap: 0.5rem; align-items: center; }

    .btn-link {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .btn-link:hover { text-decoration: underline; }
    
    .cupom-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px dashed #f59e0b;
      color: #fbbf24;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .subtotal { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    .subtotal.pendente { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }

    /* Barra Fixa Inferior */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #070a12;
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .total-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }

    /* GAVETA LATERAL (SIDEBAR DRAWER) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 25px rgba(0,0,0,0.5);
    }
    .sidebar-drawer.active {
      right: 0;
    }

    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .btn-close-sidebar {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }
    .btn-close-sidebar:hover { color: #fff; }

    .sidebar-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .cart-item {
      display: flex;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      align-items: center;
    }

    .cart-item img {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      object-fit: contain;      /* Mantém a miniatura proporcional */
      background-color: #0b1329;
      padding: 0.2rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cart-item-details {
      flex-grow: 1;
      min-width: 0;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-loja {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .cart-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
    }

    .cart-qty-ctrl button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      padding: 0.1rem 0.3rem;
      font-size: 0.85rem;
    }
    .cart-qty-ctrl button:hover { color: #fff; }
    .cart-qty-ctrl span { font-size: 0.85rem; font-weight: 600; min-width: 18px; text-align: center; }

    .btn-remove-item {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
      margin-left: 0.25rem;
    }

    .sidebar-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: #080c16;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .sidebar-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
    }

    /* Botão de Exportação de PDF */
    .btn-pdf {
      background: #059669;
      color: #fff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-pdf:hover { background: #047857; }
    .btn-pdf:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }

    /* Ajustes para Dispositivos Móveis */
    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
        gap: 0.75rem;
      }
      .toolbar input, .toolbar select {
        width: 100%;
        min-width: unset;
      }
      .grid-itens {
        grid-template-columns: 1fr;
      }
      .sidebar-drawer {
        max-width: 90vw;
      }
      footer {
        padding: 0.75rem 1rem;
        flex-direction: row;
        font-size: 0.8rem;
      }
      .total-val {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-voltar"></a>
    <h1>CFP - Curso de Formação de Praças</h1>
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <a href="lojas.html" class="btn-nav-lojas">🏪 Lojas</a>
      <button class="btn-toggle-cart" onclick="toggleSidebar(true)">
        📋 Resumo (<span id="cartCountBadge">0</span>)
      </button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <label style="font-size: 0.8rem; color: var(--text-muted);">Fase:</label>
        <select id="filterFase" onchange="aplicarFiltros()"></select>
      </div>
      <input type="text" id="searchItem" placeholder="Buscar equipamento no CFP..." oninput="aplicarFiltros()">
    </div>

    <div class="grid-itens" id="gridItens"></div>
  </main>

  <!-- GAVETA LATERAL RETRÁTIL -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar-drawer" id="sidebarDrawer">
    <div class="sidebar-header">
      <h2>Itens Selecionados (<span id="sidebarCount">0</span>)</h2>
      <button class="btn-close-sidebar" onclick="toggleSidebar(false)">✕</button>
    </div>

    <div class="sidebar-content" id="sidebarItemsList">
      <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
        Nenhum item selecionado ainda.<br>Escolha uma loja/marca nos cards ao lado!
      </p>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <span>Total do Enxoval:</span>
        <span class="total-val" id="sidebarTotal">R$ 0,00</span>
      </div>
      <button id="btnExportarPdf" class="btn-pdf" onclick="gerarPDF()">
        📄 Exportar PDF do Orçamento
      </button>
    </div>
  </aside>

  <!-- BARRA INFERIOR FIXA -->
  <footer>
    <div id="statsContador" style="font-size: 0.85rem; color: var(--text-muted);">Carregando dados...</div>
    <div>Total Estimado: <span class="total-val" id="totalGeral">R$ 0,00</span></div>
  </footer>
