<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enxoval CFP - PMDF</title>
  
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- jsPDF + AutoTable para geração do relatório -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --sidebar-bg: #111827;
      --border: #22304e;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; overflow-x: hidden; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-voltar {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.2s;
    }
    .btn-voltar:hover { color: var(--text); }

    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }

    .btn-toggle-cart {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.2s;
    }
    .btn-toggle-cart:hover { background: var(--primary-hover); }

    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toolbar select, .toolbar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .toolbar input { min-width: 250px; }

    .grid-itens {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 180px;            /* Altura fixa da moldura */
      object-fit: contain;      /* Garante que o equipamento apareça inteiro sem esticar */
      object-position: center;  /* Centraliza a foto horizontal e verticalmente */
      background-color: #0b1329;/* Fundo sutil para preencher as sobras */
      padding: 0.75rem;         /* Respiro para a imagem não colar nas bordas do card */
      border-bottom: 1px solid var(--border);
    }

    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; flex-grow: 1; }

    .card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tag-fase { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    .item-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .item-spec { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }

    .offer-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 6px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .offer-box select, .offer-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls-row { display: flex; gap: 0.5rem; align-items: center; }

    .btn-link {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .btn-link:hover { text-decoration: underline; }
    
    .cupom-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px dashed #f59e0b;
      color: #fbbf24;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .subtotal { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    .subtotal.pendente { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }

    /* Barra Fixa Inferior */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #070a12;
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .total-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }

    /* GAVETA LATERAL (SIDEBAR DRAWER) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 25px rgba(0,0,0,0.5);
    }
    .sidebar-drawer.active {
      right: 0;
    }

    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .btn-close-sidebar {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }
    .btn-close-sidebar:hover { color: #fff; }

    .sidebar-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .cart-item {
      display: flex;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      align-items: center;
    }

    .cart-item img {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      object-fit: contain;      /* Mantém a miniatura proporcional */
      background-color: #0b1329;
      padding: 0.2rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cart-item-details {
      flex-grow: 1;
      min-width: 0;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-loja {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .cart-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
    }

    .cart-qty-ctrl button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      padding: 0.1rem 0.3rem;
      font-size: 0.85rem;
    }
    .cart-qty-ctrl button:hover { color: #fff; }
    .cart-qty-ctrl span { font-size: 0.85rem; font-weight: 600; min-width: 18px; text-align: center; }

    .btn-remove-item {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
      margin-left: 0.25rem;
    }

    .sidebar-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: #080c16;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .sidebar-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
    }

    /* Botão de Exportação de PDF */
    .btn-pdf {
      background: #059669;
      color: #fff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-pdf:hover { background: #047857; }
    .btn-pdf:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }

    /* Ajustes para Dispositivos Móveis */
    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
        gap: 0.75rem;
      }
      .toolbar input, .toolbar select {
        width: 100%;
        min-width: unset;
      }
      .grid-itens {
        grid-template-columns: 1fr;
      }
      .sidebar-drawer {
        max-width: 90vw;
      }
      footer {
        padding: 0.75rem 1rem;
        flex-direction: row;
        font-size: 0.8rem;
      }
      .total-val {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-voltar">← Voltar para os Cursos</a>
    <h1>CFP - Curso de Formação de Praças</h1>
    <button class="btn-toggle-cart" onclick="toggleSidebar(true)">
      📋 Resumo (<span id="cartCountBadge">0</span>)
    </button>
  </header>

  <main>
    <div class="toolbar">
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <label style="font-size: 0.8rem; color: var(--text-muted);">Fase:</label>
        <select id="filterFase" onchange="aplicarFiltros()"></select>
      </div>
      <input type="text" id="searchItem" placeholder="Buscar equipamento no CFP..." oninput="aplicarFiltros()">
    </div>

    <div class="grid-itens" id="gridItens"></div>
  </main>

  <!-- GAVETA LATERAL RETRÁTIL -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar-drawer" id="sidebarDrawer">
    <div class="sidebar-header">
      <h2>Itens Selecionados (<span id="sidebarCount">0</span>)</h2>
      <button class="btn-close-sidebar" onclick="toggleSidebar(false)">✕</button>
    </div>

    <div class="sidebar-content" id="sidebarItemsList">
      <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
        Nenhum item selecionado ainda.<br>Escolha uma loja/marca nos cards ao lado!
      </p>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <span>Total do Enxoval:</span>
        <span class="total-val" id="sidebarTotal">R$ 0,00</span>
      </div>
      <button id="btnExportarPdf" class="btn-pdf" onclick="gerarPDF()">
        📄 Exportar PDF do Orçamento
      </button>
    </div>
  </aside>

  <!-- BARRA INFERIOR FIXA -->
  <footer>
    <div id="statsContador" style="font-size: 0.85rem; color: var(--text-muted);">Carregando dados...</div>
    <div>Total Estimado: <span class="total-val" id="totalGeral">R$ 0,00</span></div>
  </footer>

  <script>
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
      }

      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
        e.preventDefault();
        return false;
      }

      if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
      }
      
      if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        return false;
      }
    });
    
    const URL_CFP = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqEYk6xu9SEIjRqDwPshjrsKyvQumoihCjIcM4WKaXQAsiAvp1WOcYe2XIObI5m2vz6kGCamWkrks0/pub?gid=0&single=true&output=csv';
    const URL_PRECO = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqEYk6xu9SEIjRqDwPshjrsKyvQumoihCjIcM4WKaXQAsiAvp1WOcYe2XIObI5m2vz6kGCamWkrks0/pub?gid=1625403665&single=true&output=csv';

    let rawItens = [];
    let rawPrecos = [];
    let selecoesUsuario = {};

   async function init() {
      localStorage.removeItem('enxoval_pmdf_cfp_state');
      await carregarPrecos();
      await carregarItens();
    }

    async function parseCSV(url) {
      const response = await fetch(url, { redirect: 'follow' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();

      return new Promise((resolve, reject) => {
        Papa.parse(text, {
          header: true,
          skipEmptyLines: 'greedy',
          transformHeader: h => h.trim(),
          complete: results => resolve(results.data),
          error: err => reject(err)
        });
      });
    }

    async function carregarPrecos() {
      try {
        rawPrecos = await parseCSV(URL_PRECO);
      } catch (e) {
        console.warn('Aba de preços indisponível:', e);
      }
    }

    async function carregarItens() {
      document.getElementById('statsContador').innerText = 'Carregando enxoval do CFP...';
      try {
        rawItens = await parseCSV(URL_CFP);
        povoarFiltroFases();
        aplicarFiltros();
      } catch (e) {
        document.getElementById('gridItens').innerHTML = `<p style="color: var(--text-muted); padding: 1rem;">Erro ao carregar dados: ${e.message}</p>`;
      }
    }

    function getProp(obj, chavesPossiveis) {
      if (!obj) return '';
      const limpar = str => String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
      const chavesReais = Object.keys(obj);

      for (const procurada of chavesPossiveis) {
        const limpaProcurada = limpar(procurada);
        const achada = chavesReais.find(k => limpar(k) === limpaProcurada);
        if (achada && obj[achada] !== undefined && obj[achada] !== null) {
          return String(obj[achada]).trim();
        }
      }
      return '';
    }

    function converterPreco(val) {
      if (!val) return 0;
      const limpo = String(val).replace('R$', '').replace(/\s/g, '').replace(',', '.');
      const num = parseFloat(limpo);
      return isNaN(num) ? 0 : num;
    }

    function povoarFiltroFases() {
      const fases = [...new Set(rawItens.map(i => getProp(i, ['Fase', 'Etapa'])).filter(Boolean))];
      const select = document.getElementById('filterFase');
      select.innerHTML = '<option value="">Todas as Fases</option>' + 
        fases.map(f => `<option value="${f}">${f}</option>`).join('');
    }

    function aplicarFiltros() {
      const fase = document.getElementById('filterFase').value;
      const busca = document.getElementById('searchItem').value.toLowerCase();

      const filtrados = rawItens.filter(item => {
        const itemNome = getProp(item, ['Item', 'Nome_Item', 'Nome', 'Descricao']).toLowerCase();
        const itemFase = getProp(item, ['Fase', 'Etapa']);

        const matchFase = !fase || itemFase === fase;
        const matchBusca = !busca || itemNome.includes(busca);
        return matchFase && matchBusca;
      });

      renderCards(filtrados);
      calcularTotal();
      renderSidebar();
    }

    function renderCards(itens) {
      const container = document.getElementById('gridItens');
      if (!itens.length) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Nenhum item encontrado.</p>';
        return;
      }

      container.innerHTML = itens.map(item => {
        const id = getProp(item, ['ID_Item', 'ID', 'Codigo']);
        const nome = getProp(item, ['Item', 'Nome_Item', 'Nome', 'Descricao']) || 'Item sem nome';
        const fase = getProp(item, ['Fase', 'Etapa']);
        const especificacao = getProp(item, ['Especificacao', 'Especificação', 'Detalhes']);
        const img = getProp(item, ['URL_Imagem', 'Imagem', 'Foto']);
        const qtdPadrao = parseInt(getProp(item, ['Qtd_Padrao', 'Qtd', 'Quantidade'])) || 1;

        const ofertas = rawPrecos.filter(p => {
          const pId = getProp(p, ['ID_Item', 'ID', 'Codigo']);
          const pItem = getProp(p, ['Item', 'Nome_Item', 'Nome']);
          return (id && pId && pId.toLowerCase() === id.toLowerCase()) || 
                 (nome && pItem && pItem.toLowerCase() === nome.toLowerCase());
        });

        const cardKey = id || nome;

        if (!selecoesUsuario[cardKey]) {
          selecoesUsuario[cardKey] = {
            ofertaIndex: '',
            qtd: qtdPadrao,
            preco: 0,
            link: '',
            nome: nome,
            img: img || 'https://placehold.co/400x250/151d30/94a3b8?text=Sem+Foto',
            lojaLabel: ''
          };
        }

        const sel = selecoesUsuario[cardKey];
        const subtotal = (sel.preco * sel.qtd) || 0;
        const itemSelecionado = sel.ofertaIndex !== '' && sel.preco > 0;

        // Pega a oferta atual e lê direto a coluna CUPOM da planilha
        const ofertaAtual = ofertas[parseInt(sel.ofertaIndex, 10)];
        const cupomTexto = (ofertaAtual && ofertaAtual['CUPOM']) ? String(ofertaAtual['CUPOM']).trim() : '';

        return `
          <div class="card">
            <img src="${img || 'https://placehold.co/400x250/151d30/94a3b8?text=Sem+Foto'}" alt="${nome}" onerror="this.src='https://placehold.co/400x250/151d30/94a3b8?text=Sem+Foto'">
            <div class="card-body">
              ${fase ? `
                <div class="card-tags">
                  <span class="tag tag-fase">${fase}</span>
                </div>
              ` : ''}
              <div class="item-title">${nome}</div>
              ${especificacao ? `<p class="item-spec">${especificacao}</p>` : ''}

              <div class="offer-box">
                <label style="font-size: 0.75rem; color: var(--text-muted);">Escolha a Loja / Marca:</label>
                <select onchange="atualizarOferta('${cardKey}', this.value, true)">
                  <option value="">-- Selecione uma opção --</option>
                  ${ofertas.map((o, idx) => {
                    const nomeLoja = getProp(o, ['Nome_Loja', 'Loja']);
                    const marca = getProp(o, ['Marca_Vendida', 'Marca', 'Modelo']);
                    const preco = converterPreco(getProp(o, ['Preco', 'Valor']));
                    const isSelected = String(idx) === String(sel.ofertaIndex);
                    return `
                      <option value="${idx}" ${isSelected ? 'selected' : ''}>
                        ${nomeLoja} ${marca ? `(${marca})` : ''} - R$ ${preco.toFixed(2).replace('.', ',')}
                      </option>
                    `;
                  }).join('')}
                </select>

                <div class="controls-row">
                  <div style="flex-grow: 1;">
                    <label style="font-size: 0.7rem; color: var(--text-muted);">Quantidade:</label>
                    <input type="number" min="1" value="${sel.qtd}" onchange="atualizarQtd('${cardKey}', this.value)">
                  </div>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem;">
                  ${sel.link ? `<a href="${sel.link}" target="_blank" rel="noopener noreferrer" class="btn-link">Ver na loja ↗</a>` : '<div></div>'}
                  ${cupomTexto !== '' && cupomTexto !== '-' ? `<span class="cupom-badge">🏷️ CUPOM: ${cupomTexto}</span>` : ''}
                </div>

                <div class="card-footer">
                  <span style="font-size: 0.8rem; color: var(--text-muted);">Subtotal:</span>
                  ${itemSelecionado 
                    ? `<span class="subtotal">R$ ${subtotal.toFixed(2).replace('.', ',')}</span>` 
                    : `<span class="subtotal pendente">Não selecionado</span>`
                  }
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function atualizarOferta(cardKey, ofertaIdx, abrirSidebarAuto = false) {
      if (!selecoesUsuario[cardKey]) return;

      if (ofertaIdx === '') {
        selecoesUsuario[cardKey].ofertaIndex = '';
        selecoesUsuario[cardKey].preco = 0;
        selecoesUsuario[cardKey].link = '';
        selecoesUsuario[cardKey].cupom = '';
        selecoesUsuario[cardKey].lojaLabel = '';
      } else {
        const ofertas = rawPrecos.filter(p => {
          const pId = getProp(p, ['ID_Item', 'ID', 'Codigo']);
          const pItem = getProp(p, ['Item', 'Nome_Item', 'Nome']);
          return (pId && pId.toLowerCase() === cardKey.toLowerCase()) || 
                 (pItem && pItem.toLowerCase() === cardKey.toLowerCase());
        });

        const oferta = ofertas[parseInt(ofertaIdx, 10)];
        if (oferta) {
          const nomeLoja = getProp(oferta, ['Nome_Loja', 'Loja']);
          const marca = getProp(oferta, ['Marca_Vendida', 'Marca', 'Modelo']);
          selecoesUsuario[cardKey].ofertaIndex = ofertaIdx;
          selecoesUsuario[cardKey].preco = converterPreco(getProp(oferta, ['Preco', 'Valor']));
          selecoesUsuario[cardKey].link = getProp(oferta, ['Link', 'URL']);
          selecoesUsuario[cardKey].cupom = getProp(oferta, ['Cupom', 'CUPOM', 'Cod_Cupom']);
          selecoesUsuario[cardKey].lojaLabel = `${nomeLoja} ${marca ? `(${marca})` : ''}`;
        }
      }
      
      aplicarFiltros();
      if (abrirSidebarAuto && ofertaIdx !== '') {
        toggleSidebar(true);
      }
    }

    function atualizarQtd(cardKey, qtd) {
      if (selecoesUsuario[cardKey]) {
        selecoesUsuario[cardKey].qtd = Math.max(1, parseInt(qtd, 10) || 1);
      }
      aplicarFiltros();
    }

    function toggleSidebar(show) {
      const drawer = document.getElementById('sidebarDrawer');
      const overlay = document.getElementById('sidebarOverlay');
      if (show) {
        drawer.classList.add('active');
        overlay.classList.add('active');
      } else {
        drawer.classList.remove('active');
        overlay.classList.remove('active');
      }
    }

    function renderSidebar() {
      const container = document.getElementById('sidebarItemsList');
      const itensAtivos = Object.entries(selecoesUsuario).filter(([_, val]) => val.ofertaIndex !== '' && val.preco > 0);
      const btnPdf = document.getElementById('btnExportarPdf');

      document.getElementById('cartCountBadge').innerText = itensAtivos.length;
      document.getElementById('sidebarCount').innerText = itensAtivos.length;

      if (btnPdf) {
        btnPdf.disabled = itensAtivos.length === 0;
      }

      if (!itensAtivos.length) {
        container.innerHTML = `
          <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
            Nenhum item selecionado ainda.<br>Escolha uma loja/marca nos cards ao lado!
          </p>
        `;
        return;
      }

      container.innerHTML = itensAtivos.map(([key, val]) => {
        const subtotal = val.preco * val.qtd;
        return `
          <div class="cart-item">
            <img src="${val.img}" alt="${val.nome}" onerror="this.src='https://placehold.co/400x250/151d30/94a3b8?text=Sem+Foto'">
            <div class="cart-item-details">
              <div class="cart-item-title" title="${val.nome}">${val.nome}</div>
              <div class="cart-item-loja" title="${val.lojaLabel}">${val.lojaLabel}</div>
              <div class="cart-item-price">R$ ${subtotal.toFixed(2).replace('.', ',')}</div>
            </div>

            <div class="cart-qty-ctrl">
              <button onclick="atualizarQtd('${key}', ${val.qtd - 1})">−</button>
              <span>${val.qtd}</span>
              <button onclick="atualizarQtd('${key}', ${val.qtd + 1})">+</button>
            </div>

            <button class="btn-remove-item" title="Remover seleção" onclick="atualizarOferta('${key}', '')">🗑️</button>
          </div>
        `;
      }).join('');
    }

    function calcularTotal() {
      let total = 0;
      let qtdItens = 0;

      rawItens.forEach(item => {
        const cardKey = getProp(item, ['ID_Item', 'ID', 'Codigo']) || getProp(item, ['Item', 'Nome_Item', 'Nome']);
        const sel = selecoesUsuario[cardKey];
        if (sel && sel.ofertaIndex !== '' && sel.preco > 0) {
          total += sel.preco * sel.qtd;
          if (sel.qtd > 0) qtdItens++;
        }
      });

      const totalFormatado = `R$ ${total.toFixed(2).replace('.', ',')}`;
      document.getElementById('totalGeral').innerText = totalFormatado;
      document.getElementById('sidebarTotal').innerText = totalFormatado;
      document.getElementById('statsContador').innerText = `${qtdItens} de ${rawItens.length} itens orçados`;
    }

    // Geração do Relatório PDF Estruturado
    function gerarPDF() {
      const itensAtivos = Object.entries(selecoesUsuario).filter(([_, val]) => val.ofertaIndex !== '' && val.preco > 0);
      if (!itensAtivos.length) {
        alert('Selecione ao menos um equipamento para gerar o relatório.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const agora = new Date();
      const dataStr = agora.toLocaleDateString('pt-BR');
      const horaStr = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

      // Cabeçalho institucional escuro
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 26, 'F');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(255, 255, 255);
      doc.text('ORÇAMENTO DE ENXOVAL PARA O CFP - PMDF', 14, 11);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(203, 213, 225);
      doc.text('Relatório de Orçamento de Enxoval • CFP (Curso de Formação de Praças)', 14, 17);

      doc.setFontSize(8);
      doc.setTextColor(148, 163, 184);
      doc.text(`Cotação emitida em: ${dataStr} às ${horaStr}`, 14, 22);

      let totalGeral = 0;
      const rows = itensAtivos.map(([_, item], index) => {
        const subtotal = item.preco * item.qtd;
        totalGeral += subtotal;
        return [
          (index + 1).toString(),
          item.nome,
          item.lojaLabel || 'Não informada',
          item.qtd.toString(),
          `R$ ${item.preco.toFixed(2).replace('.', ',')}`,
          `R$ ${subtotal.toFixed(2).replace('.', ',')}`
        ];
      });

      rows.push([
        { content: 'TOTAL ESTIMADO', colSpan: 5, styles: { halign: 'right', fontStyle: 'bold', fillColor: [241, 245, 249] } },
        { content: `R$ ${totalGeral.toFixed(2).replace('.', ',')}`, styles: { fontStyle: 'bold', textColor: [5, 150, 105], fillColor: [241, 245, 249] } }
      ]);

      doc.autoTable({
        startY: 32,
        head: [['#', 'Item / Equipamento', 'Fornecedor / Oferta', 'Qtd', 'Unitário', 'Subtotal']],
        body: rows,
        theme: 'striped',
        headStyles: {
          fillColor: [37, 99, 235],
          textColor: [255, 255, 255],
          fontSize: 8.5,
          fontStyle: 'bold',
          halign: 'left'
        },
        styles: {
          fontSize: 8,
          cellPadding: 2.5,
          valign: 'middle'
        },
        columnStyles: {
          0: { cellWidth: 10, halign: 'center' },
          1: { cellWidth: 65 },
          2: { cellWidth: 55 },
          3: { cellWidth: 15, halign: 'center' },
          4: { cellWidth: 22, halign: 'right' },
          5: { cellWidth: 23, halign: 'right' }
        },
        alternateRowStyles: {
          fillColor: [248, 250, 252]
        },
        didDrawPage: data => {
          const pageCount = doc.internal.getNumberOfPages();
          doc.setFontSize(8);
          doc.setTextColor(148, 163, 184);
          doc.text(
            `Página ${data.pageNumber} de ${pageCount} • Sistema de Enxovais Operacionais PMDF`,
            14,
            doc.internal.pageSize.height - 10
          );
        }
      });

      doc.save(`Orcamento_CFP_PMDF_${dataStr.replace(/\//g, '-')}.pdf`);
    }

    init();
  </script>
</body>
</html>
