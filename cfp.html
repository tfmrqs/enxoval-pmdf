<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enxoval CFP - PMDF</title>
  
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- jsPDF + AutoTable para geração do relatório -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --sidebar-bg: #111827;
      --border: #22304e;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 110px; overflow-x: hidden; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-voltar {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.2s;
    }
    .btn-voltar:hover { color: var(--text); }

    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }

    .btn-nav-lojas {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-nav-lojas:hover {
      background: #28374f;
      border-color: #475569;
      color: #ffffff;
      transform: translateY(-1px);
    }
    
    .btn-toggle-cart {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.2s;
    }
    .btn-toggle-cart:hover { background: var(--primary-hover); }

    main { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toolbar select, .toolbar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .toolbar input { min-width: 250px; }

    .grid-itens {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 180px;            /* Altura fixa da moldura */
      object-fit: contain;      /* Garante que o equipamento apareça inteiro sem esticar */
      object-position: center;  /* Centraliza a foto horizontal e verticalmente */
      background-color: #0b1329;/* Fundo sutil para preencher as sobras */
      padding: 0.75rem;         /* Respiro para a imagem não colar nas bordas do card */
      border-bottom: 1px solid var(--border);
    }

    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; flex-grow: 1; }

    .card-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .tag-fase { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

    .item-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .item-spec { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }

    .offer-box {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: 6px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .offer-box select, .offer-box input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls-row { display: flex; gap: 0.5rem; align-items: center; }

    .btn-link {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .btn-link:hover { text-decoration: underline; }
    
    .cupom-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px dashed #f59e0b;
      color: #fbbf24;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .subtotal { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
    .subtotal.pendente { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }

    /* Barra Fixa Inferior */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #070a12;
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .total-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }

    /* GAVETA LATERAL (SIDEBAR DRAWER) */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 100%;
      max-width: 400px;
      height: 100vh;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 25px rgba(0,0,0,0.5);
    }
    .sidebar-drawer.active {
      right: 0;
    }

    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }

    .btn-close-sidebar {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }
    .btn-close-sidebar:hover { color: #fff; }

    .sidebar-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .cart-item {
      display: flex;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      align-items: center;
    }

    .cart-item img {
      width: 55px;
      height: 55px;
      border-radius: 6px;
      object-fit: contain;      /* Mantém a miniatura proporcional */
      background-color: #0b1329;
      padding: 0.2rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .cart-item-details {
      flex-grow: 1;
      min-width: 0;
    }

    .cart-item-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-loja {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }

    .cart-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.15rem 0.3rem;
    }

    .cart-qty-ctrl button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      padding: 0.1rem 0.3rem;
      font-size: 0.85rem;
    }
    .cart-qty-ctrl button:hover { color: #fff; }
    .cart-qty-ctrl span { font-size: 0.85rem; font-weight: 600; min-width: 18px; text-align: center; }

    .btn-remove-item {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
      margin-left: 0.25rem;
    }

    .sidebar-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: #080c16;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .sidebar-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      font-weight: 700;
    }

    /* Botão de Exportação de PDF */
    .btn-pdf {
      background: #059669;
      color: #fff;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-pdf:hover { background: #047857; }
    .btn-pdf:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }

    /* Ajustes para Dispositivos Móveis */
    @media (max-width: 640px) {
      .toolbar {
        flex-direction: column;
        gap: 0.75rem;
      }
      .toolbar input, .toolbar select {
        width: 100%;
        min-width: unset;
      }
      .grid-itens {
        grid-template-columns: 1fr;
      }
      .sidebar-drawer {
        max-width: 90vw;
      }
      footer {
        padding: 0.75rem 1rem;
        flex-direction: row;
        font-size: 0.8rem;
      }
      .total-val {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="btn-voltar"></a>
    <h1>CFP - Curso de Formação de Praças</h1>
    <div style="display: flex; align-items: center; gap: 0.6rem;">
      <a href="lojas.html" class="btn-nav-lojas">🏪 Lojas</a>
      <button class="btn-toggle-cart" onclick="toggleSidebar(true)">
        📋 Resumo (<span id="cartCountBadge">0</span>)
      </button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <label style="font-size: 0.8rem; color: var(--text-muted);">Fase:</label>
        <select id="filterFase" onchange="aplicarFiltros()"></select>
      </div>
      <input type="text" id="searchItem" placeholder="Buscar equipamento no CFP..." oninput="aplicarFiltros()">
    </div>

    <div class="grid-itens" id="gridItens"></div>
  </main>

  <!-- GAVETA LATERAL RETRÁTIL -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar-drawer" id="sidebarDrawer">
    <div class="sidebar-header">
      <h2>Itens Selecionados (<span id="sidebarCount">0</span>)</h2>
      <button class="btn-close-sidebar" onclick="toggleSidebar(false)">✕</button>
    </div>

    <div class="sidebar-content" id="sidebarItemsList">
      <p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
        Nenhum item selecionado ainda.<br>Escolha uma loja/marca nos cards ao lado!
      </p>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-footer-row">
        <span>Total do Enxoval:</span>
        <span class="total-val" id="sidebarTotal">R$ 0,00</span>
      </div>
      <button id="btnExportarPdf" class="btn-pdf" onclick="gerarPDF()">
        📄 Exportar PDF do Orçamento
      </button>
    </div>
  </aside>

  <!-- BARRA INFERIOR FIXA -->
  <footer>
    <div id="statsContador" style="font-size: 0.85rem; color: var(--text-muted);">Carregando dados...</div>
    <div>Total Estimado: <span class="total-val" id="totalGeral">R$ 0,00</span></div>
  </footer>

<script>
    (function(){
      if(window.location.pathname.endsWith('.html')){
        window.history.replaceState(null,document.title,window.location.pathname.replace(/\/[^\/]+\.html$/,'/'));
      }
      document.addEventListener('contextmenu',function(_0xe){_0xe.preventDefault();});
      document.addEventListener('keydown',function(_0xe){
        if(_0xe.key==='F12'||_0xe.keyCode===123){_0xe.preventDefault();return false;}
        if(_0xe.ctrlKey&&_0xe.shiftKey&&['I','i','J','j','C','c'].includes(_0xe.key)){_0xe.preventDefault();return false;}
        if(_0xe.ctrlKey&&['u','U','s','S'].includes(_0xe.key)){_0xe.preventDefault();return false;}
      });

      const _0xdc=function(_0xarr,_0xk){
        return _0xarr.map(function(_0xc){return String.fromCharCode(_0xc^_0xk);}).join('');
      };
   
      const _0xk0=[50,62,62,42,41,80,93,93,54,53,57,41,84,61,53,53,61,54,57,84,57,53,63,93,41,42,40,57,59,58,41,60,57,57,62,41,93,62,93,64,90,123,107,114,87,83,76,104,127,105,114,66,74,79,83,115,107,98,90,75,66,77,106,74,104,114,117,107,67,65,75,47,117,71,59,48,77,88,111,123,75,73,117,123,76,78,74,107,119,77,75,107,101,117,88,107,122,88,119,79,109,75,79,123,114,75,105,86,93,42,79,56,121,61,63,66,94,77,76,80,62,79,87,46,79,47,79,44,79,79,79,94,53,79,46,42,79,46,121,57,41,40];
      const _0xk1=[50,62,62,42,41,80,93,93,54,53,57,41,84,61,53,53,61,54,57,84,57,53,63,93,41,42,40,57,59,58,41,60,57,57,62,41,93,62,93,64,90,123,107,114,87,83,76,104,127,105,114,66,74,79,83,115,107,98,90,75,66,77,106,74,104,114,117,107,67,65,75,47,117,71,59,48,77,88,111,123,75,73,117,123,76,78,74,107,119,77,75,107,101,117,88,107,122,88,119,79,109,75,79,123,114,75,105,86,93,42,79,56,121,61,63,66,94,79,76,88,79,90,78,89,78,78,79,94,53,79,46,42,79,46,121,57,41,40];

      const _0x_u1=_0xdc(_0xk0,0x5A);
      const _0x_u2=_0xdc(_0xk1,0x5A);

      let _0x_items=[],_0x_prices=[],_0x_cart={};

      async function _0x_init(){
        try{localStorage.removeItem('enxoval_pmdf_cfp_state');}catch(_0xe){}
        await _0x_loadPrices();
        await _0x_loadItems();
      }

      async function _0x_fetchCSV(_0xurl){
        const _0xres=await fetch(_0xurl,{redirect:'follow'});
        if(!_0xres.ok)throw new Error('HTTP '+_0xres.status);
        const _0xtxt=await _0xres.text();
        return new Promise((_0xok,_0xerr)=>{
          Papa.parse(_0xtxt,{
            header:true,
            skipEmptyLines:'greedy',
            transformHeader:_0xh=>_0xh.trim(),
            complete:_0xr=>_0xok(_0xr.data),
            error:_0xe=>_0xerr(_0xe)
          });
        });
      }

      async function _0x_loadPrices(){
        try{_0x_prices=await _0x_fetchCSV(_0x_u2);}catch(_0xe){console.warn('Precos:',_0xe);}
      }

      async function _0x_loadItems(){
        const _0xst=document.getElementById('statsContador');
        if(_0xst)_0xst.innerText='Carregando enxoval do CFP...';
        try{
          _0x_items=await _0x_fetchCSV(_0x_u1);
          _0x_populatePhases();
          window.aplicarFiltros();
        }catch(_0xe){
          const _0xgr=document.getElementById('gridItens');
          if(_0xgr)_0xgr.innerHTML='<p style="color:var(--text-muted);padding:1rem;">Erro ao carregar dados: '+_0xe.message+'</p>';
        }
      }

      function _0x_getVal(_0xobj,_0xkeys){
        if(!_0xobj)return '';
        const _0xclean=_0xs=>String(_0xs).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
        const _0xrk=Object.keys(_0xobj);
        for(const _0xk of _0xkeys){
          const _0xkn=_0xclean(_0xk);
          const _0xm=_0xrk.find(_0xkey=>_0xclean(_0xkey)===_0xkn);
          if(_0xm&&_0xobj[_0xm]!==undefined&&_0xobj[_0xm]!==null)return String(_0xobj[_0xm]).trim();
        }
        return '';
      }

      function _0x_parseCurrency(_0xval){
        if(!_0xval)return 0;
        const _0xn=parseFloat(String(_0xval).replace('R$','').replace(/\s/g,'').replace(',','.'));
        return isNaN(_0xn)?0:_0xn;
      }

      function _0x_populatePhases(){
        const _0xphases=[...new Set(_0x_items.map(_0xi=>_0x_getVal(_0xi,['Fase','Etapa'])).filter(Boolean))];
        const _0xsel=document.getElementById('filterFase');
        if(_0xsel){
          _0xsel.innerHTML='<option value="">Todas as Fases</option>'+_0xphases.map(_0xp=>`<option value="${_0xp}">${_0xp}</option>`).join('');
        }
      }

      window.aplicarFiltros=function(){
        const _0xfEl=document.getElementById('filterFase');
        const _0xsEl=document.getElementById('searchItem');
        const _0xfVal=_0xfEl?_0xfEl.value:'';
        const _0xsVal=_0xsEl?_0xsEl.value.toLowerCase():'';

        const _0xfiltered=_0x_items.filter(_0xi=>{
          const _0xname=_0x_getVal(_0xi,['Item','Nome_Item','Nome','Descricao']).toLowerCase();
          const _0xphase=_0x_getVal(_0xi,['Fase','Etapa']);
          return (!_0xfVal||_0xphase===_0xfVal)&&(!_0xsVal||_0xname.includes(_0xsVal));
        });

        _0x_renderCards(_0xfiltered);
        _0x_calcTotal();
        _0x_renderSidebar();
      };

      function _0x_renderCards(_0xlist){
        const _0xct=document.getElementById('gridItens');
        if(!_0xct)return;
        if(!_0xlist.length){
          _0xct.innerHTML='<p style="color:var(--text-muted);grid-column:1/-1;">Nenhum item encontrado.</p>';
          return;
        }

        _0xct.innerHTML=_0xlist.map(_0xit=>{
          const _0xid=_0x_getVal(_0xit,['ID_Item','ID','Codigo']);
          const _0xname=_0x_getVal(_0xit,['Item','Nome_Item','Nome','Descricao'])||'Item sem nome';
          const _0xphase=_0x_getVal(_0xit,['Fase','Etapa']);
          const _0xspec=_0x_getVal(_0xit,['Especificacao','Especificação','Detalhes']);
          const _0ximg=_0x_getVal(_0xit,['URL_Imagem','Imagem','Foto']);
          const _0xdefQty=parseInt(_0x_getVal(_0xit,['Qtd_Padrao','Qtd','Quantidade']))||1;

          const _0xoffers=_0x_prices.filter(_0xp=>{
            const _0xpi=_0x_getVal(_0xp,['ID_Item','ID','Codigo']);
            const _0xpn=_0x_getVal(_0xp,['Item','Nome_Item','Nome']);
            return (_0xid&&_0xpi&&_0xpi.toLowerCase()===_0xid.toLowerCase())||(_0xname&&_0xpn&&_0xpn.toLowerCase()===_0xname.toLowerCase());
          });

          const _0xkey=_0xid||_0xname;
          if(!_0x_cart[_0xkey]){
            _0x_cart[_0xkey]={ofertaIndex:'',qtd:_0xdefQty,preco:0,link:'',cupom:'',nome:_0xname,img:_0ximg||'https://placehold.co/400x250/151d30/94a3b8?text=Sem+Foto',lojaLabel:''};
          }

          const _0xcur=_0x_cart[_0xkey];
          const _0xsub=(_0xcur.preco*_0xcur.qtd)||0;
          const _0xisSel=_0xcur.ofertaIndex!==''&&_0xcur.preco>0;
          const _0xmatchOf=_0xoffers[parseInt(_0xcur.ofertaIndex,10)];
          const _0xcpn=(_0xmatchOf&&_0xmatchOf['CUPOM'])?String(_0xmatchOf['CUPOM']).trim():'';
