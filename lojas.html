<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lojas • Enxoval PMDF</title>
  
  <!-- Fontes de Alta Precisão -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>

      --bg: #060911;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-hover: rgba(24, 35, 60, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.35);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --maps-blue: #bfdbfe;
      --maps-blue-hover: #93c5fd;
      --maps-text: #1e3a8a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --blur: blur(14px);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
      -webkit-font-smoothing: antialiased; 
    }

    body { 
      background: var(--bg); 
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.06) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text); 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    header {
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .btn-voltar {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-voltar:hover {
      color: #fff;
      background: rgba(51, 65, 85, 0.8);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    main { 
      max-width: 1200px; 
      margin: 1.75rem auto; 
      padding: 0 1.25rem; 
      flex-grow: 1;
      width: 100%;
    }

    .header-section {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .header-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #60a5fa;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      width: fit-content;
    }

    .header-section h2 { 
      font-size: 1.6rem; 
      font-weight: 800; 
      color: #fff; 
    }
    .header-section p { 
      font-size: 0.88rem; 
      color: var(--text-muted); 
    }

    /* Toolbar de Busca */
    .toolbar {
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      padding: 0.65rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 1.75rem;
      color: var(--text-dim);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .toolbar input {
      background: rgba(6, 9, 17, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 1rem 0.55rem 2.4rem;
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 0.84rem;
      width: 100%;
      transition: border-color 0.2s;
    }
    .toolbar input:focus { border-color: var(--border-focus); }

    /* Grid de Lojas */
    .grid-lojas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.25rem;
    }

    .card-loja {
      background: var(--card-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-loja:hover {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 246, 0.4);
      background: var(--card-hover);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* Miniatura do Google Maps */
    .map-preview-wrap {
      width: 100%;
      height: 155px;
      position: relative;
      background: #0b1329;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .map-preview-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: auto;
      filter: contrast(1.05) saturate(1.1);
    }

    .map-floating-icon {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .card-content {
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      flex-grow: 1;
    }

    .loja-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .loja-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .loja-nome {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loja-dados {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      flex-grow: 1;
    }

    /* Botão "Como chegar" idêntico ao widget do Maps */
    .btn-como-chegar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--maps-blue);
      color: var(--maps-text);
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      width: fit-content;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-como-chegar:hover {
      background: var(--maps-blue-hover);
      transform: translateY(-1px);
    }

    /* Botões Auxiliares */
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.55rem 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-whats {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .btn-whats:hover {
      background: #10b981;
      color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-site {
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.35);
      color: #60a5fa;
    }
    .btn-site:hover {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px var(--primary-glow);
      transform: translateY(-1px);
    }

    .dado-vazio {
      color: var(--text-dim);
      font-size: 0.74rem;
      font-style: italic;
      text-align: center;
      padding: 0.35rem 0;
      background: rgba(6, 9, 17, 0.3);
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
      background: rgba(8, 12, 22, 0.95);
      backdrop-filter: var(--blur);
    }

    /* Mobile */
    @media (max-width: 768px) {
      header { padding: 0.65rem 1rem; }
      main { margin: 1rem auto; padding: 0 0.85rem; }
      .grid-lojas { grid-template-columns: 1fr; gap: 0.95rem; }
      .map-preview-wrap { height: 140px; }
      .btn-action { padding: 0.65rem 0.85rem; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

  <header>
    <a href="cfp.html" class="btn-voltar">← Voltar ao Enxoval</a>
    <div class="brand-title">
      <span>🏪</span> <span>Lojas</span>
    </div>
    <span style="width: 30px;"></span>
  </header>

  <main>
    <div class="header-section">
      <div class="header-tag">Lista de Lojas</div>
      <h2>Fornecedores de Equipamentos</h2>
      <p>Consulte diretamente os preços com as lojas.</p>
    </div>

    <div class="toolbar">
      <span class="search-icon">🔍</span>
      <input type="text" id="buscaLoja" placeholder="Buscar por nome da loja..." oninput="filtrarLojas()">
    </div>

    <div class="grid-lojas" id="gridLojas">
      <p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 3rem;">Carregando diretório de lojas...</p>
    </div>
  </main>

  <footer>
    <strong>PMDF</strong> • Sistema de Gestão de Enxovais Operacionais
  </footer>
