<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    :root {

      --card-bg: #151d30;
      --border: #22304e;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .btn-voltar {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.2s;
    }
    .btn-voltar:hover { color: var(--text); }

    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }

    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

    .header-section {
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .header-section h2 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .header-section p { font-size: 0.9rem; color: var(--text-muted); }

    .toolbar {
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .toolbar input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
      width: 100%;
    }
    .toolbar input:focus { border-color: var(--primary); }

    .grid-lojas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .card-loja {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card-loja:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }

    .loja-nome {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .loja-dados {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      width: 100%;
    }

    .btn-whats {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-whats:hover {
      background: #10b981;
      color: #fff;
    }

    .btn-site {
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.4);
      color: #60a5fa;
    }
    .btn-site:hover {
      background: var(--primary);
      color: #fff;
    }

    .dado-vazio {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
      text-align: center;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>

  <header>
    <a href="cfp.html" class="btn-voltar">← Voltar para o Enxoval</a>
    <h1>LISTA DE LOJAS</h1>
    <span style="width: 50px;"></span>
  </header>

  <main>
    <div class="header-section">
      <h2>Lojas</h2>
      <p>Consulte diretamente as lojas para confirmar os preços dos itens do enxoval.</p>
    </div>

    <div class="toolbar">
      <input type="text" id="buscaLoja" placeholder="Buscar por nome da loja..." oninput="filtrarLojas()">
    </div>

    <div class="grid-lojas" id="gridLojas">
      <p style="color: var(--text-muted); grid-column: 1/-1;">Carregando lista de lojas...</p>
    </div>
  </main>
